Count":0,"fleeRequested":false,"outsideSeconds":0,"boundsWarning":false,"ambulanceRequested":false,"leaderLoaded":false,"completionSequence":null,"failure":""}},"completed":[],"consumedImpacts":[]};for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{const id=button.value;const state=structuredClone(initial);state.selectedId=id;state.missions[id].phase='selected';state.combat={checkpoint:id};localStorage.setItem("neta-solo-missions-c1",JSON.stringify(state));localStorage.setItem('neta-tutorial-v1',JSON.stringify({version:1,dontShowAgain:true,completed:false}));location.replace('/?qa=1');});</script></html>
